name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tool: math, name: "درجات الرياضيات", id: com.hameed.grades.math }
          - { tool: science, name: "درجات العلوم", id: com.hameed.grades.science }
          - { tool: english, name: "درجات الإنجليزية", id: com.hameed.grades.english }
          - { tool: arabic, name: "درجات العربية", id: com.hameed.grades.arabic }
          - { tool: any-subject, name: "درجات المواد", id: com.hameed.grades.any }
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare files
        run: |
          mkdir -p App/Sources App/www App/Assets.xcassets/AppIcon.appiconset
          cp AppDelegate.swift ViewController.swift App/Sources/
          cp "${{ matrix.tool }}.html" App/www/index.html
          cp "icon-${{ matrix.tool }}.png" App/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          printf '%s' '{"info":{"author":"xcode","version":1}}' > App/Assets.xcassets/Contents.json
          printf '%s' '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > App/Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Generate Xcode project
        env:
          APP_NAME: ${{ matrix.name }}
          BUNDLE_ID: ${{ matrix.id }}
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry "${{ matrix.tool }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-ipa
          path: ${{ matrix.tool }}.ipa
